# Render's "Infrastructure as Code" file -- this is what Render reads
# when you connect this GitHub repo, instead of clicking through its
# dashboard by hand. See https://render.com/docs/deploy-django.
#
# ASSUMPTIONS to double-check the first time you actually deploy:
#   - `name: kalingapp-backend` becomes the URL kalingapp-backend.onrender.com
#     (Render appends a random suffix instead if that name's already taken --
#     if so, update DJANGO_ALLOWED_HOSTS below to match the real one).
#   - `plan: free` on both services -- fine for testing, but Render's free
#     Postgres expires after ~30 days (already flagged in the roadmap) and
#     the free web service "spins down" after 15 minutes of no traffic,
#     so the first request after a quiet period is slow to wake it up.

services:
  - type: web
    name: kalingapp-backend
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: kalingapp-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: kalingapp-db
          property: connectionString
      # Not set here on purpose -- paste the real key into Render's
      # dashboard yourself after the first deploy, the same way you did
      # in the local .env. Leaving it unset keeps chat on local-fallback
      # responses, same safe default as local dev.
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: kalingapp-db
    plan: free

# Render's "Infrastructure as Code" file -- this is what Render reads
# when you connect this GitHub repo, instead of clicking through its
# dashboard by hand. See https://render.com/docs/deploy-django.
#
# `name: kalingapp-backend` -> confirmed live at kalingapp-backend.onrender.com
# (verified 2026-08-30, matches DJANGO_ALLOWED_HOSTS below).
#
# `plan: free` on both services -- fine for testing, but Render's free
# Postgres expires after ~30 days (already flagged in the roadmap) and
# the free web service "spins down" after 15 minutes of no traffic, so
# the first request after a quiet period is slow to wake it up.

services:
  - type: web
    name: kalingapp-backend
    runtime: python
    plan: free
    buildCommand: ./build.sh
    # --timeout 40, up from gunicorn's 30s default: a detailed Gemini
    # chat reply (chat/gemini_client.py, MAX_TOKENS=4000) can legitimately
    # take close to 30s to generate, and gunicorn's default was killing
    # the whole worker process mid-request when it did -- outside
    # Python's control, so no try/except in the view could catch it.
    # gemini_client.py's own HTTP_TIMEOUT_MS (25s) stays under this, so a
    # call that's genuinely stuck (not just slow) still fails fast as a
    # catchable exception rather than relying on this as the only net.
    startCommand: gunicorn config.wsgi:application --timeout 40
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: kalingapp-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: kalingapp-db
          property: connectionString
      # Not set here on purpose -- paste the real key into Render's
      # dashboard yourself after the first deploy, the same way you did
      # in the local .env. Leaving it unset keeps chat on local-fallback
      # responses, same safe default as local dev.
      - key: OPENAI_API_KEY
        sync: false
      # Real model behind chat now (see chat/gemini_client.py) -- paste
      # the real key into Render's dashboard yourself, same as every
      # other secret here. Missing this is exactly why chat can look
      # "stuck on offline mode" even after the code is deployed: the
      # code silently falls back to canned answers when this is unset,
      # with nothing in the response to say why.
      - key: GEMINI_API_KEY
        sync: false
      # Same pattern: paste the real values into Render's dashboard
      # yourself, never here. Without these, account-verification emails
      # silently fall back to Django's console backend (printed to
      # Render's server log, which a mother can never see) -- see
      # config/settings/base.py.
      #
      # BREVO_API_KEY is the one that matters here: Render blocks
      # outbound SMTP (ports 25/465/587), confirmed by a real send
      # attempt from this service recording "OSError: [Errno 101]
      # Network is unreachable" against smtp.gmail.com. So every
      # SMTP-based option below is dead on arrival in production
      # regardless of provider, and email goes out over HTTPS instead
      # (see core/email_backends.py). This is a DIFFERENT credential
      # from BREVO_SMTP_KEY -- it starts with "xkeysib-" and lives under
      # Brevo's SMTP & API -> API keys tab. DEFAULT_FROM_EMAIL must
      # still be an address verified under Senders & IP -> Senders.
      - key: BREVO_API_KEY
        sync: false
      # SMTP credentials, kept only because they're harmless and useful
      # for local dev, where outbound SMTP isn't blocked.
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      # Gmail is superseded by Brevo above -- confirmed via a raw SMTP
      # trace that Gmail's own server fully accepted every send (clean
      # 250 OK), but mail to a different real address never arrived, no
      # bounce, nothing in spam. A personal Gmail account programmatically
      # sending verification codes matches the behavioral signature of a
      # phishing bot closely enough that Gmail's spam ML can silently bin
      # it -- no amount of SPF/DKIM/DMARC config fixes that, since there's
      # no owned sending domain to configure those on. Left here, unset,
      # as an easy revert path.
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # SendGrid is superseded by Brevo above (its free tier runs on a
      # trial that expires; Brevo's forever-free tier doesn't) -- left
      # here, unset, as an easy revert path, same as OPENAI_API_KEY above
      # being left in place after the move to AWS Bedrock/Gemini.
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # ensure_admin (run from build.sh) reads these to create the
      # first admin account -- free-tier workaround for not having
      # Shell access to run `createsuperuser` by hand. ADMIN_PASSWORD
      # is a real secret: fill it in via Render's dashboard, never here.
      # It's only ever used once (see accounts/management/commands/
      # ensure_admin.py) -- change it through /admin/ after first login,
      # not by editing this value again.
      - key: ADMIN_EMAIL
        value: admin@kalingapp.onrender.com
      - key: ADMIN_PASSWORD
        sync: false
      # Comma-separated list of web frontend URLs allowed to call this API
      # from a browser (Android is unaffected -- CORS is a browser-only
      # rule). localhost:3000/3001 are here so the Facility and Admin
      # Next.js apps can both be run locally at once against this live
      # backend (Next.js auto-picks 3001 if 3000 is already taken),
      # without needing to also run Django locally. Add each app's real
      # deployed URL here once it exists, e.g.:
      #   http://localhost:3000,http://localhost:3001,https://kalingapp-admin.vercel.app,https://kalingapp-facility.vercel.app
      # NOTE: the two deployed dashboards
      # (kalingapp-admin/kalingapp-facility.vercel.app) do NOT depend on
      # this any more -- they're pinned in config/settings/prod.py, after
      # this list sat stale at localhost-only while they were live and
      # silently blocked login on both. This is only for origins not
      # known at build time, e.g. a future custom domain.
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:3001"
      # Enforces the 8-business-hour milk bank SLA (facility response,
      # mother's attendance confirmation) -- see milkbank/business_hours.py
      # and milkbank/transitions.py's sweep_expired_requests(). This host
      # has no Celery/cron worker, so the actual timeout ALSO happens
      # lazily whenever a mother or facility staff member loads their
      # requests -- this token only makes it happen sooner than that, via
      # an external pinger.
      #
      # Generate any long random string yourself (e.g. `openssl rand -hex
      # 32`) and paste it into Render's dashboard, same as every other
      # secret here. Then, on a free service like cron-job.org, schedule a
      # POST every 15-30 minutes to:
      #   https://kalingapp-backend.onrender.com/milkbank/sweep-expired/
      # with header:
      #   X-Sweep-Token: <the same string>
      # Leaving this unset does NOT disable the check -- it fails CLOSED
      # (see StaffSweepExpiredView), it just means expiry only ever
      # happens lazily, on someone's next page load, not on a timer.
      - key: MILKBANK_SWEEP_TOKEN
        sync: false

databases:
  - name: kalingapp-db
    plan: free
